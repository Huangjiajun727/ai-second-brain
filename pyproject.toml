[project]
name = "notes"
version = "0.1.0"
description = "笔记程序（uv + src 布局）"
readme = "README.md"
authors = [
    { name = "huangjiajun", email = "hjj@cdqcp.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
notes = "notes.main:main"

[tool.fastapi]
entrypoint = "notes.request:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
