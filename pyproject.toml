[project]
name = "notes"
version = "0.1.0"
description = "笔记程序（uv + src 布局）"
readme = "README.md"
authors = [
    { name = "huangjiajun", email = "hjj@cdqcp.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
notes = "notes.main:main"

[tool.fastapi]
entrypoint = "notes.request:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
# 保留未被使用的 import，不自动删除。
# 学习练习中经常需要「先导入、待会儿再用」，被自动清掉很打断思路。
# 格式化（缩进/引号/行宽）和 import 排序仍然生效。
ignore = ["F401"]
